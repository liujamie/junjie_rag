server:
  port: 8989

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  profiles:
    active: dev
  ai:
    websearch:
#      api-key:  ${websearch.api-key}
      api-key: ""
      searxng:
        url: "http://127.0.0.1:8080/search"
        nums: 10
        engines: "duckduckgo,google,bing,brave,mojeek,presearch,qwant,startpage,yahoo,arxiv,crossref,google_scholar,internetarchivescholar,semantic_scholar"
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash
          max-tokens: 4096
#          model: deepseek-v4-pro
    ollama:
      base-url: http://localhost:11434
      embedding:
        enabled: true
        model: bge-m3

    vectorstore:
      milvus:
        client:
          host: "localhost" # default: localhost
          port: 19530 # default: 19530
          username: "" # default: root
          password: "" # default: milvus
        databaseName: "default"
        collectionName: "vector_store" # default: vector_store
        embeddingDimension: 1024 # BGE-M3 维度
        indexType: IVF_FLAT # default: IVF_FLAT
        metricType: COSINE # default: COSINE
        initializeSchema: true # 自动创建集合（MilvusSchemaConfig 兜底）

  autoconfigure:
    exclude:
      - org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration

  datasource:
    username: root
    password: root
    url: jdbc:mysql://localhost:3306/junjie_rag?serverTimezone=UTC&socketTimeout=600000&connectTimeout=30000
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      min-idle: 3
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 600000
      max-evictable-idle-time-millis: 900000
      remove-abandoned-timeout-millis: 600000

  data:
    redis:
      port: 6379              # Redis 服务器端口，默认为 6379
#      password:               # Redis 密码，默认为空
      timeout: 5000ms         # 连接超时时间
      lettuce:
        pool:
          max-active: 8       # 最大连接数
          max-idle: 4         # 最大空闲连接数
          min-idle: 1         # 最小空闲连接数
          max-wait: 2000ms
  task:
    scheduling:
      pool:
        size: 2
aliyun:
  alioss:
    endpoint: oss-cn-beijing.aliyuncs.com
    access-key-id: ${alioss.access-key-id}
    access-key-secret: ${alioss.access-key-secret}
    bucket-name: oss02-liuxu

junjie:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: junjie
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    user-secret-key: junjie
    user-ttl: 7200000
    user-token-name: authorization
  websearch:
    api-key: ""

dashscope:
  api-key: ${DASHSCOPE_API_KEY}


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: junjie-rag
    export:
      prometheus:
        enabled: true
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always

logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: debug
    com:
      junjie:
        rag: debug
        rag.mapper: info   # 关闭 MyBatis SQL 的 DEBUG 日志，避免文件列表轮询刷屏




